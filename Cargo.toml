[package]
name = "xmip-core-authorize-scope"
version.workspace = true
edition.workspace = true
license.workspace = true
repository = "https://github.com/IlleNilsson/xmip-core-authorize-scope"
description = "Scope authorization: the scopes a token carries against the scope an action on an artifact needs, as OAuth 2.0 states them; a transport-layer policy. A xmip-core-authorize technology."
publish.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
# A Technology depends on its parent Capability, never the reverse
# (repository-model.md). The Authorizer trait is authorize's, the facts it
# judges are context's, and the layer is xmip-core's.
authorize = { workspace = true }
# identify for the evidence name the token's scopes are learned under
# (identify::evidence::SCOPE), which the authenticate technologies write.
identify = { workspace = true }
context = { workspace = true }
xcore = { workspace = true }

[lints]
workspace = true
